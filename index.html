<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Anshita’s Arts | Simple Test</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #faf7f2; }
    .card { background: white; padding: 15px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #ccc; max-width: 400px; }
    .title { color: #8b1e0f; margin-top: 0; }
  </style>
</head>
<body>

  <h1>Anshita’s Arts Test Page</h1>
  <div id="display">Loading items...</div>

  <script>
    // PASTE YOUR PUBLISHED CSV URL HERE inside the quotes
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRebhz2aYlKqUGn23T5S_P8w_eqKFs7GzL9SJBTXYnb-KOlaPsiH6J93XIT2rsRhi3kQgsDTPZakiHm/pub?output=csv";

    async function getData() {
      const display = document.getElementById('display');
      try {
        const response = await fetch(CSV_URL);
        const text = await response.text();
        
        // Parse CSV text into rows
        const rows = text.trim().split('\n').map(row => row.split(','));
        const headers = rows[0].map(h => h.trim().toLowerCase().replace(/"/g, ''));
        
        display.innerHTML = ''; // Clear loading text

        // Loop through data rows (skipping header row)
        for (let i = 1; i < rows.length; i++) {
          const values = rows[i].map(v => v.trim().replace(/"/g, ''));
          const item = {};
          headers.forEach((header, index) => {
            item[header] = values[index] || '';
          });

          display.innerHTML += `
            <div class="card">
              <h2 class="title">${item['title'] || 'No Title'}</h2>
              <p><strong>Size:</strong> ${item['size'] || 'N/A'}</p>
              <p><strong>Status:</strong> ${item['status'] || 'N/A'}</p>
            </div>
          `;
        }
      } catch (err) {
        display.innerHTML = '<p style="color:red;">Failed to connect to Google Sheet.</p>';
      }
    }

    getData();
  </script>
</body>
</html>
