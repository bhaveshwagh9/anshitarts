<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anshita Arts - Catalogue</title>
  
  <!-- Modern Font & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      /* Palette inspired by Anshita Arts Logo */
      --bg-color: #fcf8f2;
      --card-bg: #ffffff;
      --text-main: #2b1810;
      --text-muted: #735a4c;
      --border-color: #ebdcd0;
      
      --maroon: #700918;
      --maroon-dark: #4a030e;
      --gold: #d4af37;
      --gold-gradient: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
      --maroon-gradient: linear-gradient(135deg, #800020 0%, #4a0012 100%);
      --whatsapp-color: #25d366;
      
      /* Badge Custom Colors */
      --status-available-bg: #dcfce7;
      --status-available-border: #86efac;
      --status-available-text: #15803d;

      --status-booked-bg: #fee2e2;
      --status-booked-border: #fca5a5;
      --status-booked-text: #991b1b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding-bottom: 100px; /* Space for the frozen bottom contact bar */
      line-height: 1.5;
    }

    /* Header */
    header {
      background: #ffffff;
      border-bottom: 3px solid var(--gold);
      padding: 16px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(112, 9, 24, 0.08);
    }

    .logo {
      max-width: 220px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    /* Frozen Bottom Action Bar (Call & WhatsApp) */
    .contact-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 12px 16px;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.08);
    }

    .btn-contact {
      flex: 1;
      max-width: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 16px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-contact:active {
      transform: scale(0.96);
    }

    .btn-phone {
      background: var(--maroon-gradient);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(112, 9, 24, 0.3);
    }

    .btn-wa {
      background-color: var(--whatsapp-color);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(37, 211, 102, 0.3);
    }

    .section-title {
      text-align: center;
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--maroon);
      margin: 20px 0 20px 0;
      position: relative;
    }

    .section-title::after {
      content: '';
      display: block;
      width: 50px;
      height: 3px;
      background: var(--gold-gradient);
      margin: 6px auto 0 auto;
      border-radius: 2px;
    }

    /* Grid Layout */
    .card-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    @media (min-width: 640px) {
      .card-container {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1024px) {
      .card-container {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    /* Card Styling */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(112, 9, 24, 0.05);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: translateY(-3px);
    }

    /* Image Wrapper */
    .img-wrapper {
      width: 100%;
      height: 280px;
      background-color: #f7f3ee;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--border-color);
      overflow: hidden;
    }

    .main-img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      cursor: pointer;
      transition: filter 0.3s ease;
    }

    /* Black and White mode for Booked Items */
    .card.is-booked .main-img {
      filter: grayscale(100%);
    }

    /* Booked Ribbon Banner Across Image */
    .booked-ribbon {
      display: none;
      position: absolute;
      top: 25px;
      right: -35px;
      transform: rotate(45deg);
      background-color: #dc2626;
      color: #ffffff;
      font-weight: 800;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 6px 40px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.3);
      z-index: 10;
      pointer-events: none;
    }

    .card.is-booked .booked-ribbon {
      display: block;
    }

    /* Card Body Structure */
    .card-body {
      padding: 18px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Status Badge Container */
    .status-row {
      display: flex;
      align-items: center;
    }

    .badge {
      display: inline-block;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border: 1px solid transparent;
    }

    /* Green Available Badge */
    .badge-available { 
      background: var(--status-available-bg); 
      border-color: var(--status-available-border);
      color: var(--status-available-text); 
      font-size: 0.85rem;
      padding: 6px 16px;
    }

    .badge-booked { 
      background: var(--status-booked-bg); 
      border-color: var(--status-booked-border);
      color: var(--status-booked-text); 
    }

    .badge-default { 
      background: #f5f5f4; 
      border-color: #e7e5e4;
      color: var(--text-muted); 
    }

    /* Title & Meta */
    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--maroon-dark);
      margin-top: 2px;
    }

    .meta-row {
      font-size: 0.92rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    /* Gallery Thumbnails */
    .gallery-section {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px dashed var(--border-color);
    }

    .gallery-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--gold);
      margin-bottom: 8px;
    }

    .gallery-grid {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .thumb-img {
      width: 60px;
      height: 60px;
      object-fit: contain;
      background-color: #f7f3ee;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      flex-shrink: 0;
      cursor: pointer;
    }

    /* Lightbox Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 2000;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.92);
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      max-width: 94%;
      max-height: 85vh;
      border-radius: 8px;
      object-fit: contain;
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 20px;
      color: white;
      font-size: 2.2rem;
      cursor: pointer;
    }

    .state-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- Header with Brand Logo -->
  <header>
    <img src="images/logo.png" alt="Anshita Arts Logo" class="logo">
  </header>

  <h2 class="section-title">Our Creations</h2>

  <!-- Item Cards Container -->
  <div id="cardsWrapper" class="card-container">
    <div class="state-msg">Loading catalog items...</div>
  </div>

  <!-- Frozen Sticky Contact Action Bar at Bottom -->
  <div class="contact-bar">
    <a href="tel:+917020496791" class="btn-contact btn-phone">
      <i class="fa-solid fa-phone"></i> Call Us
    </a>
    <a href="https://wa.me/917020496791?text=Hello%20Anshita%20Arts,%20I%20have%20an%20inquiry" target="_blank" class="btn-contact btn-wa">
      <i class="fa-brands fa-whatsapp"></i> WhatsApp
    </a>
  </div>

  <!-- Lightbox Modal -->
  <div id="imageModal" class="modal" onclick="closeModal()">
    <span class="modal-close">&times;</span>
    <img id="modalImage" class="modal-content" src="" alt="Enlarged view">
  </div>

  <script>
    const sheetCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRebhz2aYlKqUGn23T5S_P8w_eqKFs7GzL9SJBTXYnb-KOlaPsiH6J93XIT2rsRhi3kQgsDTPZakiHm/pub?output=csv';
    const whatsappPhone = '917020496791';

    function formatDriveUrl(rawInput) {
      if (!rawInput) return '';
      const idMatch = rawInput.match(/([a-zA-Z0-9_-]{25,})/);
      return idMatch && idMatch[1] ? `https://lh3.googleusercontent.com/d/${idMatch[1]}` : '';
    }

    function getStatusClass(status) {
      if (!status) return 'badge-default';
      const clean = status.toLowerCase().trim();
      if (clean.includes('available')) return 'badge-available';
      if (clean.includes('booked')) return 'badge-booked';
      return 'badge-default';
    }

    function parseCsv(text) {
      const lines = text.split('\n');
      return lines.map(line => {
        const row = [];
        let insideQuotes = false;
        let entry = '';
        for (let char of line) {
          if (char === '"') {
            insideQuotes = !insideQuotes;
          } else if (char === ',' && !insideQuotes) {
            row.push(entry.trim().replace(/^"|"$/g, ''));
            entry = '';
          } else {
            entry += char;
          }
        }
        row.push(entry.trim().replace(/^"|"$/g, ''));
        return row;
      });
    }

    function openModal(imgSrc) {
      const modal = document.getElementById('imageModal');
      const modalImg = document.getElementById('modalImage');
      modal.style.display = 'flex';
      modalImg.src = imgSrc;
    }

    function closeModal() {
      document.getElementById('imageModal').style.display = 'none';
    }

    async function fetchGalleryData() {
      try {
        const response = await fetch(sheetCsvUrl);
        const csvText = await response.text();
        
        const rows = parseCsv(csvText);
        const container = document.getElementById('cardsWrapper');
        container.innerHTML = '';

        let validCardCount = 0;

        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          if (row.length < 4 || !row[1]) continue;

          validCardCount++;

          const title = row[1];
          const size = row[2];
          const status = row[3] || '';
          const mainImgRaw = row[4] || '';
          const extraImgsRaw = row[5] || '';

          const mainImgSrc = formatDriveUrl(mainImgRaw);
          const statusClass = getStatusClass(status);
          const isBooked = status.toLowerCase().includes('booked');

          const extraMatches = extraImgsRaw.match(/([a-zA-Z0-9_-]{25,})/g) || [];
          const extraImgUrls = extraMatches.map(id => `https://lh3.googleusercontent.com/d/${id}`);

          let extraImagesHtml = '';
          if (extraImgUrls.length > 0) {
            extraImagesHtml = `
              <div class="gallery-section">
                <div class="gallery-title">More Images</div>
                <div class="gallery-grid">
                  ${extraImgUrls.map(url => `
                    <img src="${url}" class="thumb-img" alt="Thumbnail" onclick="openModal('${url}')" onerror="this.style.display='none'">
                  `).join('')}
                </div>
              </div>
            `;
          }

          const cardHtml = `
            <div class="card ${isBooked ? 'is-booked' : ''}">
              <div class="img-wrapper">
                <div class="booked-ribbon">Booked</div>
                <img src="${mainImgSrc}" 
                     class="main-img" 
                     alt="${title}" 
                     onclick="openModal('${mainImgSrc}')"
                     onerror="this.onerror=null; this.src='https://via.placeholder.com/400x300?text=No+Image';">
              </div>
              <div class="card-body">
                <!-- 1. Status Badge -->
                <div class="status-row">
                  <span class="badge ${statusClass}">${status}</span>
                </div>
                
                <!-- 2. Title -->
                <h3 class="card-title">${title}</h3>
                
                <!-- 3. Size -->
                <div class="meta-row">
                  <span><strong>Size:</strong> ${size}</span>
                </div>
                
                <!-- 4. More Images -->
                ${extraImagesHtml}
              </div>
            </div>
          `;
          container.innerHTML += cardHtml;
        }

        if (validCardCount === 0) {
          container.innerHTML = '<div class="state-msg">No items found in catalog.</div>';
        }
      } catch (err) {
        console.error('Failed to parse sheet data', err);
        document.getElementById('cardsWrapper').innerHTML = '<div class="state-msg">Error loading catalog.</div>';
      }
    }

    fetchGalleryData();
  </script>
</body>
</html>
