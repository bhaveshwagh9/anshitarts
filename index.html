<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Item Gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .card-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .card {
      background: white;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .main-img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      background-color: #eee;
    }

    .card-content {
      padding: 15px;
      flex: 1;
    }

    .card-title {
      font-size: 1.2rem;
      margin: 0 0 10px 0;
    }

    .card-detail {
      margin: 4px 0;
      color: #555;
    }

    .status-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      background-color: #e0e0e0;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .gallery {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .thumb-img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid #ddd;
    }
  </style>
</head>
<body>

  <h2>Catalog Items</h2>
  <div id="cardsWrapper" class="card-container">Loading catalog...</div>

  <script>
    // Replace with your published CSV URL
    const sheetCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRebhz2aYlKqUGn23T5S_P8w_eqKFs7GzL9SJBTXYnb-KOlaPsiH6J93XIT2rsRhi3kQgsDTPZakiHm/pub?output=csv';

    // Converts ANY Google Drive link/ID into a direct viewable image URL
    function formatDriveUrl(rawInput) {
      if (!rawInput) return '';
      
      // Match 33+ character Google Drive File ID
      const idMatch = rawInput.match(/([a-zA-Z0-9_-]{25,})/);
      if (idMatch && idMatch[1]) {
        return `https://lh3.googleusercontent.com/d/${idMatch[1]}`;
      }
      return '';
    }

    // Robust CSV parser that handles quotes and extra commas safely
    function parseCsv(text) {
      const lines = text.split('\n');
      return lines.map(line => {
        const row = [];
        let insideQuotes = false;
        let entry = '';
        
        for (let char of line) {
          if (char === '"') {
            insideQuotes = !insideQuotes;
          } else if (char === ',' && !insideQuotes) {
            row.push(entry.trim());
            entry = '';
          } else {
            entry += char;
          }
        }
        row.push(entry.trim());
        return row;
      });
    }

    async function fetchGalleryData() {
      try {
        const response = await fetch(sheetCsvUrl);
        const csvText = await response.text();
        
        const rows = parseCsv(csvText);
        const container = document.getElementById('cardsWrapper');
        container.innerHTML = '';

        // Skip header row (i = 1)
        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          if (row.length < 4 || !row[1]) continue;

          // Standard Google Form structure:
          // [0] Timestamp | [1] Title | [2] Size | [3] Status | [4] Main Image | [5] View More Images
          const title = row[1];
          const size = row[2];
          const status = row[3];
          const mainImgRaw = row[4] || '';
          const extraImgsRaw = row[5] || '';

          const mainImgSrc = formatDriveUrl(mainImgRaw);

          // Extract multiple images if present in the "View More" column
          const extraMatches = extraImgsRaw.match(/([a-zA-Z0-9_-]{25,})/g) || [];
          const extraImgUrls = extraMatches.map(id => `https://lh3.googleusercontent.com/d/${id}`);

          let extraImagesHtml = '';
          if (extraImgUrls.length > 0) {
            extraImagesHtml = `
              <div style="margin-top:12px;"><strong>View More Images:</strong></div>
              <div class="gallery">
                ${extraImgUrls.map(url => `
                  <a href="${url}" target="_blank">
                    <img src="${url}" class="thumb-img" alt="Additional image" onerror="this.style.display='none'">
                  </a>
                `).join('')}
              </div>
            `;
          }

          const cardHtml = `
            <div class="card">
              <img src="${mainImgSrc}" class="main-img" alt="${title}" onerror="this.onerror=null; this.src='https://via.placeholder.com/300x200?text=Image+Not+Accessible';">
              <div class="card-content">
                <h3 class="card-title">${title}</h3>
                <p class="card-detail"><strong>Size:</strong> ${size}</p>
                <p class="card-detail"><strong>Status:</strong> <span class="status-badge">${status}</span></p>
                ${extraImagesHtml}
              </div>
            </div>
          `;
          container.innerHTML += cardHtml;
        }
      } catch (err) {
        console.error('Failed to parse sheet data', err);
        document.getElementById('cardsWrapper').innerHTML = '<p>Error loading data. Check console.</p>';
      }
    }

    fetchGalleryData();
  </script>
</body>
</html>
