<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Form Results</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: left;
    }

    th {
      background-color: #007bff;
      color: white;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }
  </style>
</head>
<body>

  <h2>Submitted Results</h2>
  <table>
    <thead>
      <tr>
        <th>Timestamp</th>
        <th>Title</th>
        <th>Size</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="resultsTable">
      <tr>
        <td colspan="4">Loading data...</td>
      </tr>
    </tbody>
  </table>

  <script>
    // Replace this URL with your Google Sheet's published CSV link
    const sheetCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRebhz2aYlKqUGn23T5S_P8w_eqKFs7GzL9SJBTXYnb-KOlaPsiH6J93XIT2rsRhi3kQgsDTPZakiHm/pub?output=csv';

    async function fetchSheetData() {
      try {
        const response = await fetch(sheetCsvUrl);
        const data = await response.text();
        
        // Parse CSV rows
        const rows = data.split('\n').map(row => row.split(','));
        const tableBody = document.getElementById('resultsTable');
        tableBody.innerHTML = '';

        // Skip header row (index 0) and display entries
        for (let i = 1; i < rows.length; i++) {
          if (rows[i].length >= 4) {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td>${rows[i][0]}</td>
              <td>${rows[i][1]}</td>
              <td>${rows[i][2]}</td>
              <td>${rows[i][3]}</td>
            `;
            tableBody.appendChild(tr);
          }
        }
      } catch (error) {
        console.error('Error fetching data:', error);
      }
    }

    // Load data when page opens
    fetchSheetData();
  </script>

</body>
</html>
