<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Item Gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .card-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .card {
      background: white;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .main-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background-color: #eee;
    }

    .card-content {
      padding: 15px;
      flex: 1;
    }

    .card-title {
      font-size: 1.2rem;
      margin: 0 0 10px 0;
    }

    .card-detail {
      margin: 4px 0;
      color: #555;
    }

    .status-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      background-color: #e0e0e0;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .gallery {
      display: flex;
      gap: 5px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .thumb-img {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid #ddd;
    }
  </style>
</head>
<body>

  <h2>Catalog Items</h2>
  <div id="cardsWrapper" class="card-container">Loading catalog...</div>

  <script>
    const sheetCsvUrl = 'YOUR_PUBLISHED_CSV_URL_HERE';

    // Helper: Converts Google Drive share link to direct image link
    function formatDriveUrl(driveUrl) {
      if (!driveUrl) return '';
      const match = driveUrl.match(/id=([a-zA-Z0-9_-]+)/) || driveUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
      return match ? `https://drive.google.com/uc?export=view&id=${match[1]}` : driveUrl.trim();
    }

    async function fetchGalleryData() {
      try {
        const response = await fetch(sheetCsvUrl);
        const csvText = await response.text();
        
        // Split by lines
        const rows = csvText.split('\n').map(row => row.split(','));
        const container = document.getElementById('cardsWrapper');
        container.innerHTML = '';

        // Expecting columns: [0] Timestamp, [1] Title, [2] Size, [3] Status, [4] Main Image, [5] Extra Images
        for (let i = 1; i < rows.length; i++) {
          if (rows[i].length >= 4) {
            const title = rows[i][1];
            const size = rows[i][2];
            const status = rows[i][3];
            const mainImgRaw = rows[i][4] || '';
            const extraImgsRaw = rows[i][5] || '';

            const mainImgSrc = formatDriveUrl(mainImgRaw);
            
            // Handle multiple extra images (Google Sheets separates multiple uploads with comma/space)
            const extraImgsList = extraImgsRaw.split(',').map(url => formatDriveUrl(url)).filter(url => url);

            let extraImagesHtml = '';
            if (extraImgsList.length > 0) {
              extraImagesHtml = `
                <div style="margin-top:10px;"><strong>More Images:</strong></div>
                <div class="gallery">
                  ${extraImgsList.map(img => `<img src="${img}" class="thumb-img" alt="extra">`).join('')}
                </div>
              `;
            }

            const cardHtml = `
              <div class="card">
                <img src="${mainImgSrc}" class="main-img" alt="${title}" onerror="this.src='https://via.placeholder.com/300x200?text=No+Image'">
                <div class="card-content">
                  <h3 class="card-title">${title}</h3>
                  <p class="card-detail"><strong>Size:</strong> ${size}</p>
                  <p class="card-detail"><strong>Status:</strong> <span class="status-badge">${status}</span></p>
                  ${extraImagesHtml}
                </div>
              </div>
            `;
            container.innerHTML += cardHtml;
          }
        }
      } catch (err) {
        console.error('Failed to parse sheet data', err);
      }
    }

    fetchGalleryData();
  </script>
</body>
</html>
