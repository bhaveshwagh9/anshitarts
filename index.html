<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anshita’s Arts | Festive Draping & Decoration</title>
  <style>
    :root {
      --primary: #8b1e0f;
      --accent: #d4af37;
      --bg: #faf7f2;
      --card-bg: #ffffff;
      --text: #2c2c2c;
    }
    body { font-family: sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 0; }
    header { background-color: var(--primary); color: var(--accent); text-align: center; padding: 2rem 1rem; border-bottom: 4px solid var(--accent); }
    header h1 { margin: 0; font-size: 2.2rem; }
    header p { color: #fff; margin-top: 0.5rem; }
    .container { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    .card { background: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); overflow: hidden; margin-bottom: 2rem; border: 1px solid #e0dcd5; }
    .card-img-container { width: 100%; height: 350px; background-color: #eee; }
    .card-img-container img { width: 100%; height: 100%; object-fit: cover; }
    .card-content { padding: 1.5rem; }
    .card-title { font-size: 1.5rem; color: var(--primary); margin: 0 0 0.5rem 0; }
    .badge { display: inline-block; padding: 0.25rem 0.6rem; font-size: 0.85rem; font-weight: bold; border-radius: 4px; margin-bottom: 1rem; }
    .badge-available { background-color: #e6f4ea; color: #137333; }
    .badge-booked { background-color: #fce8e6; color: #c5221f; }
    .info-group { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.5rem; }
    .info-item { font-size: 1.05rem; }
    .info-label { font-weight: bold; color: var(--primary); }
    .btn-whatsapp { display: inline-block; padding: 0.75rem 1.25rem; border-radius: 6px; text-decoration: none; font-weight: bold; background-color: #25d366; color: white; text-align: center; }
    #loading { text-align: center; font-size: 1.2rem; margin: 3rem; }
  </style>
</head>
<body>

  <header>
    <h1>Anshita’s Arts</h1>
    <p>Customized Ganpati Draping & Artistic Festive Decoration</p>
  </header>

  <div class="container" id="gallery">
    <div id="loading">Loading collection...</div>
  </div>

  <script>
    // 1. PASTE YOUR GOOGLE SHEET ID HERE
    const SHEET_ID = "1LprOK47LVee4avUubT2k6_rLwTM9ilPQKs4smaLTT28";
    
    // 2. PASTE YOUR SISTER-IN-LAW'S WHATSAPP NUMBER HERE (e.g., 919876543210)
    const PHONE_NUMBER = "7854214587";

    const SHEET_NAME = "Form Responses 1";
    const API_URL = `https://opensheet.elk.sh/${SHEET_ID}/${SHEET_NAME}`;

    async function loadGallery() {
      const container = document.getElementById('gallery');
      try {
        const response = await fetch(API_URL);
        const data = await response.json();
        container.innerHTML = ''; 

        data.forEach(item => {
          const isBooked = item["Status"] && item["Status"].toLowerCase() === "booked";
          const badgeClass = isBooked ? "badge-booked" : "badge-available";
          const statusText = item["Status"] || "Available";

          const cardHTML = `
            <div class="card">
              <div class="card-img-container">
                <img src="${item['Main Image URL']}" alt="${item['Title']}" onerror="this.src='https://via.placeholder.com/800x600?text=No+Image+Available'">
              </div>
              <div class="card-content">
                <span class="badge ${badgeClass}">${statusText}</span>
                <h2 class="card-title">${item['Title']}</h2>
                
                <div class="info-group">
                  <div class="info-item"><span class="info-label">Size:</span> ${item['Size']}</div>
                  <div class="info-item"><span class="info-label">Type of Draping:</span> ${item['Type of Draping']}</div>
                </div>

                <a href="https://wa.me/${PHONE_NUMBER}?text=Hi%20Anshita's%20Arts,%20I%20am%20interested%20in%20the%20${encodeURIComponent(item['Title'])}%20setup." class="btn-whatsapp" target="_blank">
                  Enquire on WhatsApp
                </a>
              </div>
            </div>
          `;
          container.innerHTML += cardHTML;
        });
      } catch (error) {
        container.innerHTML = '<p style="text-align:center; color:red;">Failed to load items. Check your Sheet ID setup.</p>';
      }
    }

    loadGallery();
  </script>
</body>
</html>
