<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Anshita’s Arts | Simple Test</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #faf7f2; }
    .card { background: white; padding: 15px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #ccc; max-width: 400px; }
    .title { color: #8b1e0f; margin-top: 0; }
  </style>
</head>
<body>

  <h1>Anshita’s Arts Test Page</h1>
  <div id="display">Loading items...</div>

  <script>
    // 1. PASTE YOUR SHEET ID HERE
    const SHEET_ID = "YOUR_EXACT_SHEET_ID_HERE";

    // OpenSheet API Endpoint
    const API_URL = `https://opensheet.elk.sh/${SHEET_ID}/1`;

    async function getData() {
      const display = document.getElementById('display');
      try {
        const response = await fetch(API_URL);
        const data = await response.json();
        
        display.innerHTML = ''; // Clear loading text

        data.forEach(item => {
          display.innerHTML += `
            <div class="card">
              <h2 class="title">${item.title}</h2>
              <p><strong>Size:</strong> ${item.size}</p>
              <p><strong>Status:</strong> ${item.status}</p>
            </div>
          `;
        });
      } catch (err) {
        display.innerHTML = '<p style="color:red;">Failed to connect to Google Sheet.</p>';
      }
    }

    getData();
  </script>
</body>
</html>
